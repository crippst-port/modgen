<!DOCTYPE html>
<html>
<head>
    <title>Test Apply Section Dates AJAX</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Apply Section Dates AJAX Response</h1>
    
    <div class="section">
        <h2>Configuration</h2>
        <p>Course ID: <input type="number" id="courseid" value="2"></p>
        <p>Section IDs (comma-separated): <input type="text" id="sectionids" value="" placeholder="e.g., 538,539"></p>
        <p>Include Parents: <input type="checkbox" id="includeparents"></p>
        <button onclick="testApply()">Test Apply Dates</button>
        <button onclick="testRemove()">Test Remove Dates</button>
    </div>

    <div class="section">
        <h2>Raw Response</h2>
        <pre id="rawResponse">Click a button to test...</pre>
    </div>

    <div class="section">
        <h2>Response Analysis</h2>
        <pre id="analysis"></pre>
    </div>

    <script>
        // Get sesskey from Moodle
        const M = window.parent.M || { cfg: { sesskey: 'test' } };

        function analyzeResponse(text) {
            const analysis = [];
            analysis.push(`Length: ${text.length} characters`);
            analysis.push(`First 100 chars: ${text.substring(0, 100)}`);
            analysis.push(`Last 100 chars: ${text.substring(text.length - 100)}`);
            
            // Try to find where JSON ends
            let jsonEndPos = -1;
            let braceCount = 0;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '{') braceCount++;
                if (text[i] === '}') {
                    braceCount--;
                    if (braceCount === 0) {
                        jsonEndPos = i;
                        break;
                    }
                }
            }
            
            if (jsonEndPos > -1 && jsonEndPos < text.length - 1) {
                analysis.push(`\nJSON appears to end at position ${jsonEndPos}`);
                analysis.push(`Extra content after JSON: "${text.substring(jsonEndPos + 1)}"`);
                analysis.push(`Extra content (hex): ${Array.from(text.substring(jsonEndPos + 1)).map(c => c.charCodeAt(0).toString(16)).join(' ')}`);
            }
            
            return analysis.join('\n');
        }

        async function testApply() {
            const courseid = document.getElementById('courseid').value;
            const sectionids = document.getElementById('sectionids').value.split(',').map(s => s.trim()).filter(s => s);
            const includeparents = document.getElementById('includeparents').checked ? 1 : 0;

            if (sectionids.length === 0) {
                alert('Please enter at least one section ID');
                return;
            }

            const params = new URLSearchParams();
            params.append('courseid', courseid);
            params.append('selectedsections', JSON.stringify(sectionids));
            params.append('includeparents', includeparents);
            params.append('sesskey', M.cfg.sesskey);

            try {
                const response = await fetch('/ai/placement/modgen/ajax/apply_section_dates.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: params.toString()
                });

                const text = await response.text();
                document.getElementById('rawResponse').textContent = text;
                document.getElementById('analysis').textContent = analyzeResponse(text);

                // Try to parse
                try {
                    const json = JSON.parse(text);
                    document.getElementById('analysis').textContent += '\n\n✓ JSON is valid!\n' + JSON.stringify(json, null, 2);
                } catch (e) {
                    document.getElementById('analysis').textContent += '\n\n✗ JSON parse error: ' + e.message;
                }
            } catch (error) {
                document.getElementById('rawResponse').textContent = 'Error: ' + error.message;
                document.getElementById('analysis').textContent = error.stack;
            }
        }

        async function testRemove() {
            const courseid = document.getElementById('courseid').value;
            const sectionids = document.getElementById('sectionids').value.split(',').map(s => s.trim()).filter(s => s);

            if (sectionids.length === 0) {
                alert('Please enter at least one section ID');
                return;
            }

            const params = new URLSearchParams();
            params.append('courseid', courseid);
            params.append('selectedsections', JSON.stringify(sectionids));
            params.append('sesskey', M.cfg.sesskey);

            try {
                const response = await fetch('/ai/placement/modgen/ajax/remove_section_dates.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: params.toString()
                });

                const text = await response.text();
                document.getElementById('rawResponse').textContent = text;
                document.getElementById('analysis').textContent = analyzeResponse(text);

                // Try to parse
                try {
                    const json = JSON.parse(text);
                    document.getElementById('analysis').textContent += '\n\n✓ JSON is valid!\n' + JSON.stringify(json, null, 2);
                } catch (e) {
                    document.getElementById('analysis').textContent += '\n\n✗ JSON parse error: ' + e.message;
                }
            } catch (error) {
                document.getElementById('rawResponse').textContent = 'Error: ' + error.message;
                document.getElementById('analysis').textContent = error.stack;
            }
        }
    </script>
</body>
</html>
